# L9 blocking vs advisory policy for @quantum-l9/llm-router.
# "PR Pipeline Gate" is the single canonical merge gate (see pr-pipeline.yml).
# Inherited debt is visible but advisory unless a touched file worsens it.
blocking_policy:
  version: 1
  merge_gate: "PR Pipeline Gate"
  blocking_jobs:
    - lint
    - build
    - test
    - security
  advisory_jobs:
    - dependency-review
    - secret-scan
  unknown_class_behavior: block_all      # fail closed
  inherited_debt_behavior: advisory_unless_touched

  hard_block_if_touched:
    - secret_leak
    - auth_bypass
    - security_boundary_weakening        # provider transport boundary (eslint lint:boundary)
    - transport_packet_contract_break    # OpenAI SDK transport clients
    - image_ingress_validation_bypass    # src/vision URL/inline-image validation
    - budget_reservation_bypass          # src/budget pre-dispatch reservation
    - contract_bound_change_without_contract_update   # src/control-plane contracts
    - classifier_failure
    - unknown_high_or_critical_security_finding

  advisory_if_untouched:
    - inherited_style_debt
    - inherited_docstring_findings
    - historical_non_touched_high_findings

  fail_closed:
    - diff_unknown
    - classifier_failure
    - missing_required_ci_context
