# Canonical namespaced label taxonomy for @quantum-l9/llm-router.
# Source of truth for the L9 label contract (l9-github-ci kernel §9 +
# l9_target_ci_spec labels). Plain labels (ci, security, testing, typing,
# docker, python, dependencies, github-actions) are deprecated and must not be
# created by automation. Provisioning to the GitHub UI is a settings-plane
# action (see docs/ci/convergence.md) — this file does not create labels itself.

automation:  # color: 5319E7
  - automation:dependabot
  - automation:coderabbit
  - automation:perplexity
  - automation:github-actions
  - automation:gitguardian
  - automation:sonarcloud
  - automation:codex
  - automation:l9-agent

type:        # color: 0E8A16
  - type:ci
  - type:security
  - type:docs
  - type:test
  - type:deps
  - type:refactor
  - type:governance
  - type:bug
  - type:feature
  - type:release

area:        # color: 1D76DB
  - area:workflows
  - area:l9
  - area:contracts
  - area:api
  - area:typing
  - area:runtime
  - area:transport      # provider transport boundary (src/providers)
  - area:vision         # image ingress validation (src/vision)
  - area:budget         # budget reservation (src/budget)
  - area:infra

risk:        # color: D93F0B
  - risk:blocking
  - risk:advisory
  - risk:secret
  - risk:deploy
  - risk:contract
  - risk:runtime
  - risk:security

deprecated_plain_labels_forbidden:
  - ci
  - security
  - testing
  - typing
  - docker
  - python
  - dependencies
  - github-actions
