# Quantum-L9 org starter — Full PR validation pipeline (lint, type-check, tests, security). Calls l9-ci-core kernel; do not add logic here.
name: "L9 PR Pipeline"
on:
  pull_request:
    branches: [main, 'release/**']
  push:
    branches: [main]

jobs:
  l9_pr_pipeline:
    # Local kernel: l9-ci-core@v1 omits GitHub Packages auth for @quantum-l9/* deps.
    uses: ./.github/workflows/l9-pr-pipeline-kernel.yml
    secrets: inherit
    with:
      working-directory: "."
