# Local override of l9-ci-core pr-pipeline@v1 for Node repos with GitHub Packages deps.
# Upstream omits packages:read, registry-url, and NODE_AUTH_TOKEN for npm ci.
name: L9 PR Pipeline (local kernel)
on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        required: false
        default: "."
permissions:
  contents: read
  packages: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          registry-url: https://npm.pkg.github.com
      - name: Install Node dependencies
        run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Type-check (tsc)
        run: npm run verify:types
      - name: Tests (Vitest)
        run: npm test
