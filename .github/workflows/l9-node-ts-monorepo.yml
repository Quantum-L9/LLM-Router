# Quantum-L9 org starter — Node/TypeScript monorepo pipeline.
# Inline jobs for install/typecheck/test/publish-dry-run.
# Security and Scorecard delegate to l9-ci-core kernels; do not add logic to those jobs.
name: "L9 Node/TS Monorepo Pipeline"
on:
  pull_request:
    branches: [main, 'release/**']
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  install-and-typecheck:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          registry-url: https://npm.pkg.github.com
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Type-check
        run: |
          if node -e "const s=(require('./package.json').scripts||{});process.exit(s.typecheck?0:1)"; then
            npm run typecheck
          elif node -e "const s=(require('./package.json').scripts||{});process.exit(s['verify:types']?0:1)"; then
            npm run verify:types
          else
            npx --no-install tsc --noEmit
          fi

  test-by-segment:
    needs: install-and-typecheck
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          registry-url: https://npm.pkg.github.com
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run tests (Vitest)
        run: npx --no-install vitest run

  publish-dry-run:
    needs: test-by-segment
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          registry-url: https://npm.pkg.github.com
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Publish dry-run (all public packages)
        run: |
          dirs="."
          if [ -d "packages" ]; then
            dirs="packages/*/"
          fi
          for pkg_dir in $dirs; do
            pkg_json="${pkg_dir%/}/package.json"
            if [ ! -f "$pkg_json" ]; then continue; fi
            private=$(node -e "const p=require('./$pkg_json'); console.log(p.private === true)")
            if [ "$private" = "false" ]; then
              echo "--- Dry-run: $pkg_dir ---"
              (cd "$pkg_dir" && npm publish --dry-run)
            else
              echo "--- Skipping private package: $pkg_dir ---"
            fi
          done

  security:
    uses: Quantum-L9/l9-ci-core/.github/workflows/security.yml@v1
    with:
      python-version: "3.12"
      run-npm-audit: true

  scorecard:
    uses: Quantum-L9/l9-ci-core/.github/workflows/scorecard.yml@v1
